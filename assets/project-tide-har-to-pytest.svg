<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Tide — HAR to Project-native pytest API Tests</title>
  <desc id="desc">Local-first, source-aware, stepwise-confirmed Skills plugin with fail-closed safety boundaries.</desc>
  <defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B14"/><stop offset=".58" stop-color="#0D1322"/><stop offset="1" stop-color="#151126"/></linearGradient><linearGradient id="accent"><stop offset="0" stop-color="#61F4DC"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#FF6FAE"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#25304B" opacity=".38"/></pattern><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect x="1" y="1" width="1198" height="328" rx="22" fill="url(#background)" stroke="url(#accent)" stroke-width="2"/><rect x="17" y="17" width="1166" height="296" rx="16" fill="url(#grid)" stroke="#25304B"/><rect x="18" y="18" width="8" height="294" rx="4" fill="#FFD166"/>
  <text x="58" y="50" fill="#FFD166" font-family="Inter, Arial, sans-serif" font-size="17">04 / <tspan font-family="Georgia, serif" font-style="italic" font-weight="700">Verify</tspan></text>
  <text x="58" y="121" fill="#F4F7FF" font-family="Georgia, serif" font-size="58" font-style="italic" font-weight="700">Tide</text>
  <text x="60" y="177" fill="#FFD166" font-family="Georgia, 'Noto Serif SC', 'Songti SC', serif" font-size="25" font-style="italic">HAR → pytest 接口测试</text>
  <text x="58" y="220" fill="#94A0BA" font-family="Georgia, serif" font-size="19" font-style="italic"><tspan x="58">Turn sanitized browser HAR into project-native pytest API tests.</tspan><tspan x="58" dy="29">Local-first, source-aware, stepwise confirmed, and fail-closed by design.</tspan></text>
  <text x="60" y="302" fill="#F4F7FF" font-family="Georgia, 'Noto Serif SC', 'Songti SC', serif" font-size="19" font-style="italic">本地脱敏、源码感知、逐步确认，生成符合现有项目规范的 pytest 接口测试。</text>
  <line x1="858" y1="52" x2="858" y2="278" stroke="#25304B"/>
  <g aria-hidden="true" fill="none"><circle cx="1024" cy="165" r="92" stroke="#FFD166" opacity=".22"/><circle cx="1024" cy="165" r="62" stroke="#FFD166" stroke-dasharray="5 9" opacity=".58"/><path d="M970 118H1014M970 143H1030M970 168H1042M970 193H1026M970 218H1048" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/><path d="M966 221L1000 192L1032 215L1080 112" stroke="#FF6FAE" stroke-width="4" filter="url(#glow)"/></g>
</svg>
