<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Koco — AI-powered QA engineer</title>
  <desc id="desc">A dark cyber terminal banner with neon cyan, violet and pink accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B12"/>
      <stop offset="0.55" stop-color="#0D111B"/>
      <stop offset="1" stop-color="#131027"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58E6D9"/>
      <stop offset="0.52" stop-color="#9B8CFF"/>
      <stop offset="1" stop-color="#FF6B9E"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.18" stop-color="#58E6D9"/>
      <stop offset="0.48" stop-color="#9B8CFF" stop-opacity=".8"/>
      <stop offset="1" stop-color="#9B8CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8B96AD" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <rect x="18" y="18" width="1164" height="324" rx="16" fill="url(#grid)" stroke="#FFFFFF" stroke-opacity=".08"/>

  <ellipse cx="1040" cy="177" rx="166" ry="154" fill="#7A4DFF" fill-opacity=".12" filter="url(#soft)"/>
  <ellipse cx="1120" cy="210" rx="95" ry="120" fill="#FF4E94" fill-opacity=".1" filter="url(#soft)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <circle cx="46" cy="45" r="5" fill="#FF6B9E"/>
    <circle cx="64" cy="45" r="5" fill="#FFD166"/>
    <circle cx="82" cy="45" r="5" fill="#58E6D9"/>
    <text x="108" y="50" fill="#AAB4C8" font-size="13" letter-spacing="3">KOCO / QUALITY_SYSTEM</text>
    <text x="1125" y="50" fill="#58E6D9" font-size="12" text-anchor="end" letter-spacing="2">ONLINE</text>

    <text x="68" y="118" fill="#58E6D9" font-size="15" letter-spacing="5">QA × AI × SYSTEMS</text>
    <text x="66" y="177" fill="#F3F6FF" font-size="46" font-weight="700" letter-spacing="1">AI-POWERED</text>
    <text x="66" y="226" fill="#F3F6FF" font-size="46" font-weight="700" letter-spacing="1">QA ENGINEER</text>
    <rect x="68" y="249" width="490" height="2" fill="url(#edge)"/>
    <text x="68" y="282" fill="#AAB4C8" font-size="15" letter-spacing="2">TEST WORKFLOWS · AGENTS · DEVELOPER TOOLS</text>
    <text x="68" y="314" fill="#667085" font-size="12" letter-spacing="2">BUILDING RELIABLE SYSTEMS FROM REAL-WORLD EVIDENCE</text>

    <g transform="translate(930 180)">
      <circle r="106" fill="none" stroke="#9B8CFF" stroke-opacity=".15"/>
      <circle r="78" fill="none" stroke="#9B8CFF" stroke-opacity=".38" stroke-dasharray="7 11"/>
      <circle r="48" fill="none" stroke="#58E6D9" stroke-opacity=".45" stroke-dasharray="2 7"/>
      <path d="M-138 0H-88M88 0H138M0-138V-108M0 108V138" stroke="#58E6D9" stroke-opacity=".5"/>
      <path d="M-74-74L-53-53M74-74L53-53M-74 74L-53 53M74 74L53 53" stroke="#FF6B9E" stroke-opacity=".55"/>
      <circle r="37" fill="url(#core)" filter="url(#glow)">
        <animate attributeName="opacity" values=".78;1;.78" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="8" fill="#080B12" stroke="#F3F6FF" stroke-width="2"/>
      <circle r="2.5" fill="#F3F6FF"/>
      <circle cx="0" cy="-106" r="4" fill="#58E6D9"/>
      <circle cx="92" cy="53" r="4" fill="#FF6B9E"/>
      <circle cx="-92" cy="53" r="4" fill="#9B8CFF"/>
    </g>

    <text x="1118" y="300" fill="#9B8CFF" font-size="11" text-anchor="end" letter-spacing="3">SIGNAL / 2026</text>
    <text x="1118" y="318" fill="#667085" font-size="10" text-anchor="end" letter-spacing="2">EVIDENCE FIRST</text>
  </g>
</svg>
