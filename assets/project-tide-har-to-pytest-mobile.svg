<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Tide — HAR to Project-native pytest API Tests</title>
  <desc id="desc">Local-first, source-aware, stepwise-confirmed Skills plugin with fail-closed safety boundaries.</desc>
  <defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B14"/><stop offset=".6" stop-color="#0D1322"/><stop offset="1" stop-color="#151126"/></linearGradient><linearGradient id="accent"><stop offset="0" stop-color="#61F4DC"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#FF6FAE"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#25304B" opacity=".4"/></pattern><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect x="1" y="1" width="718" height="518" rx="22" fill="url(#background)" stroke="url(#accent)" stroke-width="2"/><rect x="16" y="16" width="688" height="488" rx="16" fill="url(#grid)" stroke="#25304B"/><rect x="16" y="16" width="8" height="488" rx="4" fill="#FFD166"/>
  <text x="42" y="52" fill="#FFD166" font-family="Inter, Arial, sans-serif" font-size="17">04 / <tspan font-family="Georgia, serif" font-style="italic" font-weight="700">Verify</tspan></text>
  <text x="42" y="124" fill="#F4F7FF" font-family="Georgia, serif" font-size="56" font-style="italic" font-weight="700">Tide</text>
  <text x="44" y="181" fill="#FFD166" font-family="Georgia, 'Noto Serif SC', 'Songti SC', serif" font-size="25" font-style="italic">HAR → pytest 接口测试</text>
  <text x="42" y="226" fill="#94A0BA" font-family="Georgia, serif" font-size="20" font-style="italic"><tspan x="42">Turn sanitized browser HAR into</tspan><tspan x="42" dy="33">project-native pytest API tests.</tspan><tspan x="42" dy="33">Local-first, source-aware, stepwise</tspan><tspan x="42" dy="33">confirmed, and fail-closed by design.</tspan></text>
  <text x="44" y="367" fill="#F4F7FF" font-family="Georgia, 'Noto Serif SC', 'Songti SC', serif" font-size="20" font-style="italic"><tspan x="44">本地脱敏、源码感知、逐步确认，</tspan><tspan x="44" dy="33">生成符合现有项目规范的 pytest 接口测试。</tspan></text>
  <g aria-hidden="true" fill="none"><circle cx="590" cy="420" r="76" stroke="#FFD166" opacity=".28"/><circle cx="590" cy="420" r="54" stroke="#FFD166" stroke-dasharray="5 8" opacity=".62"/><path d="M550 382H580M550 400H592M550 418H600M550 436H588M550 454H604" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/><path d="M546 458L570 438L594 455L636 370" stroke="#FF6FAE" stroke-width="4" filter="url(#glow)"/></g>
</svg>
