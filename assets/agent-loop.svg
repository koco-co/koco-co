<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Agent Operating Loop</title>
  <desc id="desc">Learn with Sisyphus Vale, Shape with Agent Build Kit, Orchestrate with Kata, and Verify with Tide.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B14"/><stop offset=".58" stop-color="#0D1322"/><stop offset="1" stop-color="#151126"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#61F4DC"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#FF6FAE"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#25304B" opacity=".38"/></pattern>
    <radialGradient id="g1"><stop offset="0" stop-color="#61F4DC" stop-opacity=".75"/><stop offset="1" stop-color="#61F4DC" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#A78BFA" stop-opacity=".75"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#FF6FAE" stop-opacity=".75"/><stop offset="1" stop-color="#FF6FAE" stop-opacity="0"/></radialGradient>
    <radialGradient id="g4"><stop offset="0" stop-color="#FFD166" stop-opacity=".75"/><stop offset="1" stop-color="#FFD166" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="278" rx="22" fill="url(#background)" stroke="url(#accent)" stroke-width="2"/>
  <rect x="17" y="17" width="1166" height="246" rx="16" fill="url(#grid)" stroke="#25304B"/>
  <text x="600" y="45" text-anchor="middle" fill="#94A0BA" font-family="Georgia, 'Noto Serif SC', 'Songti SC', serif" font-size="22" font-style="italic">从知识积累到可核验证据</text>
  <g font-family="Georgia, serif" font-style="italic">
    <g transform="translate(150 0)"><text y="88" text-anchor="middle" fill="#61F4DC" font-size="22" font-weight="700">Learn</text><circle cy="135" r="34" fill="url(#g1)" stroke="#61F4DC" stroke-width="2"/><circle cy="135" r="7" fill="#61F4DC"/><text y="140" text-anchor="middle" fill="#F4F7FF" font-family="Arial, sans-serif" font-size="11" font-style="normal" font-weight="700">01</text><text y="205" text-anchor="middle" fill="#F4F7FF" font-size="23" font-weight="700">Sisyphus Vale</text><text y="245" text-anchor="middle" fill="#94A0BA" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="18">学习</text></g>
    <g transform="translate(450 0)"><text y="88" text-anchor="middle" fill="#A78BFA" font-size="22" font-weight="700">Shape</text><circle cy="135" r="34" fill="url(#g2)" stroke="#A78BFA" stroke-width="2"/><circle cy="135" r="7" fill="#A78BFA"/><text y="140" text-anchor="middle" fill="#F4F7FF" font-family="Arial, sans-serif" font-size="11" font-style="normal" font-weight="700">02</text><text y="205" text-anchor="middle" fill="#F4F7FF" font-size="23" font-weight="700">Agent Build Kit</text><text y="245" text-anchor="middle" fill="#94A0BA" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="18">塑形</text></g>
    <g transform="translate(750 0)"><text y="88" text-anchor="middle" fill="#FF6FAE" font-size="22" font-weight="700">Orchestrate</text><circle cy="135" r="34" fill="url(#g3)" stroke="#FF6FAE" stroke-width="2"/><circle cy="135" r="7" fill="#FF6FAE"/><text y="140" text-anchor="middle" fill="#F4F7FF" font-family="Arial, sans-serif" font-size="11" font-style="normal" font-weight="700">03</text><text y="205" text-anchor="middle" fill="#F4F7FF" font-size="23" font-weight="700">Kata</text><text y="245" text-anchor="middle" fill="#94A0BA" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="18">编排</text></g>
    <g transform="translate(1050 0)"><text y="88" text-anchor="middle" fill="#FFD166" font-size="22" font-weight="700">Verify</text><circle cy="135" r="34" fill="url(#g4)" stroke="#FFD166" stroke-width="2"/><circle cy="135" r="7" fill="#FFD166"/><text y="140" text-anchor="middle" fill="#F4F7FF" font-family="Arial, sans-serif" font-size="11" font-style="normal" font-weight="700">04</text><text y="205" text-anchor="middle" fill="#F4F7FF" font-size="23" font-weight="700">Tide</text><text y="245" text-anchor="middle" fill="#94A0BA" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="18">验证</text></g>
  </g>
</svg>
