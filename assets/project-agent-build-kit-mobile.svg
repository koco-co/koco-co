<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Agent Build Kit</title>
  <desc id="desc">Cross-platform toolkit for clarifying ideas, building and reviewing Agent Skills and Plugins, and maintaining project documentation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.6" stop-color="#0D1322"/>
      <stop offset="1" stop-color="#151126"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61F4DC"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#FF6FAE"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#25304B" stroke-width="1" opacity="0.4"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="718" height="518" rx="22" fill="url(#background)" stroke="url(#accent)" stroke-width="2"/>
  <rect x="16" y="16" width="688" height="488" rx="16" fill="url(#grid)" stroke="#25304B" stroke-width="1"/>
  <rect x="16" y="16" width="8" height="488" rx="4" fill="#A78BFA"/>

  <text x="42" y="52" fill="#B89BFF" font-family="Inter, Arial, sans-serif" font-size="17">02 / <tspan font-family="Georgia, serif" font-style="italic" font-weight="700">Shape</tspan></text>
  <text x="42" y="124" fill="#F4F7FF" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-style="italic" font-weight="700">Agent Build Kit</text>
  <text x="44" y="181" fill="#B89BFF" font-family="Georgia, 'Noto Serif SC', 'Songti SC', serif" font-size="25" font-style="italic">智能体构建工具箱</text>
  <text x="42" y="226" fill="#94A0BA" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic">
    <tspan x="42" dy="0">Cross-platform skills and plugin tooling for</tspan>
    <tspan x="42" dy="33">Claude Code, Codex, ZCode, and Pi.</tspan>
    <tspan x="42" dy="33">Clarify ideas, build and review agent</tspan>
    <tspan x="42" dy="33">capabilities, and maintain project docs.</tspan>
  </text>
  <text x="44" y="367" fill="#F4F7FF" font-family="Georgia, 'Noto Serif SC', 'Songti SC', serif" font-size="20" font-style="italic">
    <tspan x="44" dy="0">澄清想法，构建与审查 Agent Skill 和 Plugin，</tspan>
    <tspan x="44" dy="33">并维护项目开发文档。</tspan>
  </text>

  <g aria-hidden="true">
    <circle cx="590" cy="420" r="76" fill="none" stroke="#A78BFA" opacity="0.28"/>
    <circle cx="590" cy="420" r="54" fill="none" stroke="#A78BFA" stroke-dasharray="5 8" opacity="0.62"/>
    <circle cx="590" cy="420" r="44" fill="none" stroke="#A78BFA" stroke-width="3"/>
    <circle cx="590" cy="420" r="28" fill="none" stroke="#A78BFA" stroke-width="3"/>
    <circle cx="590" cy="420" r="12" fill="none" stroke="#A78BFA" stroke-width="3"/>
    <path d="M596 414L638 372M622 372H638V388" fill="none" stroke="#FF6FAE" stroke-width="4" filter="url(#glow)"/>
  </g>
</svg>
