<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img" aria-labelledby="title desc">
  <title id="title">Agent Operating Loop</title>
  <desc id="desc">Learn with Sisyphus Vale, Shape with Agent Build Kit, Orchestrate with Kata, and Verify with Tide.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B14"/><stop offset=".6" stop-color="#0D1322"/><stop offset="1" stop-color="#151126"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#61F4DC"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#FF6FAE"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#25304B" opacity=".4"/></pattern>
    <radialGradient id="g1"><stop offset="0" stop-color="#61F4DC" stop-opacity=".75"/><stop offset="1" stop-color="#61F4DC" stop-opacity="0"/></radialGradient><radialGradient id="g2"><stop offset="0" stop-color="#A78BFA" stop-opacity=".75"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient><radialGradient id="g3"><stop offset="0" stop-color="#FF6FAE" stop-opacity=".75"/><stop offset="1" stop-color="#FF6FAE" stop-opacity="0"/></radialGradient><radialGradient id="g4"><stop offset="0" stop-color="#FFD166" stop-opacity=".75"/><stop offset="1" stop-color="#FFD166" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="718" height="678" rx="22" fill="url(#background)" stroke="url(#accent)" stroke-width="2"/>
  <rect x="16" y="16" width="688" height="648" rx="16" fill="url(#grid)" stroke="#25304B"/>
  <text x="360" y="54" text-anchor="middle" fill="#94A0BA" font-family="Georgia, 'Noto Serif SC', 'Songti SC', serif" font-size="24" font-style="italic">从知识积累到可核验证据</text>
  <g font-family="Georgia, serif" font-style="italic">
    <g transform="translate(0 0)"><circle cx="100" cy="130" r="34" fill="url(#g1)" stroke="#61F4DC" stroke-width="2"/><circle cx="100" cy="130" r="7" fill="#61F4DC"/><text x="100" y="135" text-anchor="middle" fill="#F4F7FF" font-family="Arial, sans-serif" font-size="11" font-style="normal" font-weight="700">01</text><text x="165" y="104" fill="#61F4DC" font-size="23" font-weight="700">Learn</text><text x="165" y="145" fill="#F4F7FF" font-size="24" font-weight="700">Sisyphus Vale</text><text x="165" y="184" fill="#94A0BA" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="18">学习</text></g>
    <g transform="translate(0 145)"><circle cx="100" cy="130" r="34" fill="url(#g2)" stroke="#A78BFA" stroke-width="2"/><circle cx="100" cy="130" r="7" fill="#A78BFA"/><text x="100" y="135" text-anchor="middle" fill="#F4F7FF" font-family="Arial, sans-serif" font-size="11" font-style="normal" font-weight="700">02</text><text x="165" y="104" fill="#A78BFA" font-size="23" font-weight="700">Shape</text><text x="165" y="145" fill="#F4F7FF" font-size="24" font-weight="700">Agent Build Kit</text><text x="165" y="184" fill="#94A0BA" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="18">塑形</text></g>
    <g transform="translate(0 290)"><circle cx="100" cy="130" r="34" fill="url(#g3)" stroke="#FF6FAE" stroke-width="2"/><circle cx="100" cy="130" r="7" fill="#FF6FAE"/><text x="100" y="135" text-anchor="middle" fill="#F4F7FF" font-family="Arial, sans-serif" font-size="11" font-style="normal" font-weight="700">03</text><text x="165" y="104" fill="#FF6FAE" font-size="23" font-weight="700">Orchestrate</text><text x="165" y="145" fill="#F4F7FF" font-size="24" font-weight="700">Kata</text><text x="165" y="184" fill="#94A0BA" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="18">编排</text></g>
    <g transform="translate(0 435)"><circle cx="100" cy="130" r="34" fill="url(#g4)" stroke="#FFD166" stroke-width="2"/><circle cx="100" cy="130" r="7" fill="#FFD166"/><text x="100" y="135" text-anchor="middle" fill="#F4F7FF" font-family="Arial, sans-serif" font-size="11" font-style="normal" font-weight="700">04</text><text x="165" y="104" fill="#FFD166" font-size="23" font-weight="700">Verify</text><text x="165" y="145" fill="#F4F7FF" font-size="24" font-weight="700">Tide</text><text x="165" y="184" fill="#94A0BA" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="18">验证</text></g>
