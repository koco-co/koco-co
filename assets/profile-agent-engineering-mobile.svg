<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Koco — Harness Agent Builder</title>
  <desc id="desc">Agent Engineering Systems. 驾驭智能体，构建可验证、可复用的工程系统。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B14"/><stop offset=".6" stop-color="#0D1322"/><stop offset="1" stop-color="#151126"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#61F4DC"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#FF6FAE"/></linearGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#FFF"/><stop offset=".16" stop-color="#61F4DC"/><stop offset=".5" stop-color="#A78BFA" stop-opacity=".72"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#25304B" opacity=".4"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="718" height="718" rx="24" fill="url(#background)" stroke="url(#accent)" stroke-width="2"/>
  <rect x="16" y="16" width="688" height="688" rx="17" fill="url(#grid)" stroke="#25304B"/>
  <circle cx="38" cy="40" r="5" fill="#FF6FAE"/><circle cx="58" cy="40" r="5" fill="#FFD166"/><circle cx="78" cy="40" r="5" fill="#61F4DC"/>
  <text x="100" y="46" fill="#94A0BA" font-family="Georgia, serif" font-size="14" font-style="italic">Koco / Agent Engineering Systems</text>
  <text x="40" y="119" fill="#F4F7FF" font-family="Georgia, serif" font-size="51" font-style="italic" font-weight="700">Harness Agent</text>
  <text x="40" y="183" fill="#F4F7FF" font-family="Georgia, serif" font-size="51" font-style="italic" font-weight="700">Builder</text>
  <rect x="42" y="217" width="636" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="42" y="269" fill="#F4F7FF" font-family="Georgia, 'Noto Serif SC', 'Songti SC', serif" font-size="25" font-style="italic"><tspan x="42">驾驭智能体，构建可验证、</tspan><tspan x="42" dy="36">可复用的工程系统</tspan></text>
  <text x="42" y="342" fill="#94A0BA" font-family="Georgia, serif" font-size="16" font-style="italic"><tspan x="42">QA Engineer · AI Workflow Designer</tspan><tspan x="42" dy="27">Developer Toolmaker</tspan></text>
  <g aria-hidden="true">
    <line x1="360" y1="405" x2="360" y2="665" stroke="#A78BFA" opacity=".62"/><line x1="230" y1="535" x2="490" y2="535" stroke="#A78BFA" opacity=".62"/>
    <circle cx="360" cy="535" r="130" fill="none" stroke="#A78BFA" opacity=".28"/><circle cx="360" cy="535" r="91" fill="none" stroke="#A78BFA" stroke-width="2" stroke-dasharray="7 12" opacity=".7"/><circle cx="360" cy="535" r="53" fill="url(#core)" filter="url(#glow)"/>
    <circle cx="360" cy="405" r="7" fill="#61F4DC"/><circle cx="490" cy="535" r="7" fill="#FF6FAE"/><circle cx="360" cy="665" r="7" fill="#FFD166"/><circle cx="230" cy="535" r="7" fill="#A78BFA"/>
    <circle cx="360" cy="535" r="12" fill="none" stroke="#F4F7FF" stroke-width="2"/><circle cx="360" cy="535" r="4" fill="#61F4DC"/>
    <text x="360" y="381" text-anchor="middle" fill="#61F4DC" font-family="Georgia, serif" font-size="16" font-style="italic" font-weight="700">Learn</text>
    <text x="510" y="540" fill="#FF6FAE" font-family="Georgia, serif" font-size="16" font-style="italic" font-weight="700">Shape</text>
    <text x="360" y="694" text-anchor="middle" fill="#FFD166" font-family="Georgia, serif" font-size="16" font-style="italic" font-weight="700">Orchestrate</text>
    <text x="210" y="540" text-anchor="end" fill="#A78BFA" font-family="Georgia, serif" font-size="16" font-style="italic" font-weight="700">Verify</text>
    <text x="360" y="541" text-anchor="middle" fill="#F4F7FF" font-family="Georgia, serif" font-size="14" font-style="italic">Evidence</text>
