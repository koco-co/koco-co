<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Kata — Auditable QA Engineering Workspace</title>
  <desc id="desc">Skills and CLI connect requirements, cases, automation, diagnosis, and evidence for Claude Code and Codex.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B14"/><stop offset=".58" stop-color="#0D1322"/><stop offset="1" stop-color="#151126"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#61F4DC"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#FF6FAE"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#25304B" opacity=".38"/></pattern><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="328" rx="22" fill="url(#background)" stroke="url(#accent)" stroke-width="2"/><rect x="17" y="17" width="1166" height="296" rx="16" fill="url(#grid)" stroke="#25304B"/><rect x="18" y="18" width="8" height="294" rx="4" fill="#FF6FAE"/>
  <text x="58" y="50" fill="#FF6FAE" font-family="Inter, Arial, sans-serif" font-size="17">03 / <tspan font-family="Georgia, serif" font-style="italic" font-weight="700">Orchestrate</tspan></text>
  <text x="58" y="121" fill="#F4F7FF" font-family="Georgia, serif" font-size="58" font-style="italic" font-weight="700">Kata</text>
  <text x="60" y="177" fill="#FF6FAE" font-family="Georgia, 'Noto Serif SC', 'Songti SC', serif" font-size="25" font-style="italic">可复核 QA 工程工作区</text>
  <text x="58" y="220" fill="#94A0BA" font-family="Georgia, serif" font-size="19" font-style="italic"><tspan x="58">An auditable QA engineering workspace for Claude Code and Codex.</tspan><tspan x="58" dy="29">Skills and CLI connect requirements, cases, automation, diagnosis, and evidence.</tspan></text>
  <text x="60" y="302" fill="#F4F7FF" font-family="Georgia, 'Noto Serif SC', 'Songti SC', serif" font-size="19" font-style="italic">以 Skill 与 CLI 串联 QA 工程流水线，产物统一落盘，运行全程可复核。</text>
