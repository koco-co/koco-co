<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Kata — Auditable QA Engineering Workspace</title>
  <desc id="desc">Skills and CLI connect requirements, cases, automation, diagnosis, and evidence for Claude Code and Codex.</desc>
  <defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B14"/><stop offset=".6" stop-color="#0D1322"/><stop offset="1" stop-color="#151126"/></linearGradient><linearGradient id="accent"><stop offset="0" stop-color="#61F4DC"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#FF6FAE"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#25304B" opacity=".4"/></pattern><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect x="1" y="1" width="718" height="518" rx="22" fill="url(#background)" stroke="url(#accent)" stroke-width="2"/><rect x="16" y="16" width="688" height="488" rx="16" fill="url(#grid)" stroke="#25304B"/><rect x="16" y="16" width="8" height="488" rx="4" fill="#FF6FAE"/>
  <text x="42" y="52" fill="#FF6FAE" font-family="Inter, Arial, sans-serif" font-size="17">03 / <tspan font-family="Georgia, serif" font-style="italic" font-weight="700">Orchestrate</tspan></text>
  <text x="42" y="124" fill="#F4F7FF" font-family="Georgia, serif" font-size="56" font-style="italic" font-weight="700">Kata</text>
  <text x="44" y="181" fill="#FF6FAE" font-family="Georgia, 'Noto Serif SC', 'Songti SC', serif" font-size="25" font-style="italic">可复核 QA 工程工作区</text>
  <text x="42" y="226" fill="#94A0BA" font-family="Georgia, serif" font-size="20" font-style="italic"><tspan x="42">An auditable QA engineering workspace for</tspan><tspan x="42" dy="33">Claude Code and Codex.</tspan><tspan x="42" dy="33">Skills and CLI connect requirements, cases,</tspan><tspan x="42" dy="33">automation, diagnosis, and evidence.</tspan></text>
  <text x="44" y="367" fill="#F4F7FF" font-family="Georgia, 'Noto Serif SC', 'Songti SC', serif" font-size="20" font-style="italic"><tspan x="44">以 Skill 与 CLI 串联 QA 工程流水线，</tspan><tspan x="44" dy="33">产物统一落盘，运行全程可复核。</tspan></text>
  <g aria-hidden="true" fill="none" stroke="#FF6FAE"><circle cx="590" cy="420" r="76" opacity=".28"/><circle cx="590" cy="420" r="54" stroke-dasharray="5 8" opacity=".62"/><rect x="550" y="380" width="24" height="24" rx="6" stroke-width="3"/><rect x="606" y="380" width="24" height="24" rx="6" stroke-width="3"/><rect x="550" y="436" width="24" height="24" rx="6" stroke-width="3"/><rect x="606" y="436" width="24" height="24" rx="6" stroke-width="3"/><path d="M574 392H606M562 404V436M618 404V436M574 448H606" opacity=".7" stroke-width="2"/><circle cx="590" cy="420" r="8" fill="#FF6FAE" stroke="none" filter="url(#glow)"/></g>
</svg>
